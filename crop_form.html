<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Recommendation - FarmLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary-color: #4caf50;
            --primary-light: #80e27e;
            --primary-dark: #087f23;
            --secondary-color: #8d6e63;
            --accent-color: #ff9800;
            --light-accent: #ffecb3;
            --dark-color: #2c3e50;
            --light-color: #f8f9fa;
            --text-color: #333;
            --text-light: #6c757d;
            --white: #ffffff;
            --success: #4caf50;
            --warning: #ff9800;
            --gradient: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            --gradient-light: linear-gradient(135deg, rgba(76,175,80,0.1), rgba(141,110,99,0.1));
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            --shadow-hover: 0 15px 40px rgba(0, 0, 0, 0.15);
            --border-radius: 16px;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--gradient-light), url("https://images.unsplash.com/photo-1500382017468-9049fed747ef?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=2000&q=80") no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            color: var(--text-color);
            position: relative;
            overflow-x: hidden;
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.92);
            z-index: -1;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: var(--white);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            animation: fadeIn 1s ease-in-out;
        }

        .header {
            background: var(--gradient);
            color: var(--white);
            padding: 2rem;
            text-align: center;
            position: relative;
        }

        .header h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }

        .header p {
            font-size: 1rem;
            opacity: 0.9;
        }

        .form-container {
            padding: 2.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--dark-color);
        }

        .input-group {
            position: relative;
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e0e0e0;
            border-radius: var(--border-radius);
            font-size: 1rem;
            transition: var(--transition);
            font-family: 'Poppins', sans-serif;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.2);
        }

        .input-icon {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: var(--gradient);
            color: var(--white);
            border: none;
            padding: 1rem 2rem;
            border-radius: var(--border-radius);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            width: 100%;
            margin-top: 1rem;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--primary-color);
            text-decoration: none;
            margin-top: 1.5rem;
            font-weight: 500;
            transition: var(--transition);
        }

        .back-link:hover {
            color: var(--primary-dark);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 1.8rem;
            }
            
            .form-container {
                padding: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 1rem;
            }
            
            .header {
                padding: 1.5rem;
            }
            
            .header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-seedling"></i> Crop & Market Price Prediction</h1>
            <p>Enter your soil and climate details to get the best crop recommendation</p>
        </div>
        
        <div class="form-container">
            <form method="POST" action="/crop_recommendation">
                <div class="form-row">
                    <div class="form-group">
                        <label for="N">Nitrogen (N)</label>
                        <div class="input-group">
                            <input type="number" step="any" id="N" name="N" required>
                            <i class="fas fa-flask input-icon"></i>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="P">Phosphorous (P)</label>
                        <div class="input-group">
                            <input type="number" step="any" id="P" name="P" required>
                            <i class="fas fa-flask input-icon"></i>
                        </div>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="K">Potassium (K)</label>
                        <div class="input-group">
                            <input type="number" step="any" id="K" name="K" required>
                            <i class="fas fa-flask input-icon"></i>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="temperature">Temperature (°C)</label>
                        <div class="input-group">
                            <input type="number" step="any" id="temperature" name="temperature" required>
                            <i class="fas fa-thermometer-half input-icon"></i>
                        </div>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="humidity">Humidity (%)</label>
                        <div class="input-group">
                            <input type="number" step="any" id="humidity" name="humidity" required>
                            <i class="fas fa-tint input-icon"></i>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="ph">pH Level</label>
                        <div class="input-group">
                            <input type="number" step="any" id="ph" name="ph" required>
                            <i class="fas fa-vial input-icon"></i>
                        </div>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="rainfall">Rainfall (mm)</label>
                        <div class="input-group">
                            <input type="number" step="any" id="rainfall" name="rainfall" required>
                            <i class="fas fa-cloud-rain input-icon"></i>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="moisture">Moisture (%)</label>
                        <div class="input-group">
                            <input type="number" step="any" id="moisture" name="moisture" required>
                            <i class="fas fa-tint input-icon"></i>
                        </div>
                    </div>
                </div>
                
                <button type="submit" class="btn">
                    <i class="fas fa-chart-line"></i> Predict Crop & Price
                </button>
            </form>
            
            <a href="/" class="back-link">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>
        </div>
    </div>
</body>
</html>
